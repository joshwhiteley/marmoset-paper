[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marmoset-paper"
version = "0.2.0"
description = "Analysis and figure generation for the LIDs marmoset manuscript"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastexcel>=0.13,<0.14",
    "joblib>=1.4,<1.5",
    "matplotlib>=3.9.4,<3.10",
    "numpy>=2.0.2,<2.1",
    "openpyxl>=3.1.5,<3.2",
    "pandas>=2.2.3,<2.3",
    "polars>=1.26,<1.27",
    "pyarrow>=19,<20",
    "scikit-learn==1.6.1",
    "scipy>=1.13.1,<1.14",
    "seaborn>=0.13.2,<0.14",
    "shap>=0.48,<0.49",
]

[project.optional-dependencies]
clustering = [
    "anndata>=0.10.9,<0.11",
    "scanpy>=1.10.4,<1.11",
    "igraph>=0.11.8,<0.12",
    "leidenalg>=0.10.2,<0.11",
]
notebooks = ["ipykernel>=6.29.5,<7"]

[project.scripts]
generate-manuscript-figures = "marmoset_paper.cli:figures_main"
run-manuscript-analysis = "marmoset_paper.cli:analysis_main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/marmoset_paper"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks", "scripts/exploratory", "revisions", "um1", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
