name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest
      - run: sha256sum -c config/input_checksums.sha256
      - run: uv run run-manuscript-analysis --check
      - run: uv run generate-manuscript-figures --figures 1 2 --output-dir outputs/ci-figures
      - run: uv build --out-dir outputs/dist
